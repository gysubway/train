<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Supabase 纯净测试</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>纯净版 Supabase 测试</h2>
    <button onclick="testRegister()">点我测试注册</button>
    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        // 替换为你的信息
        const URL = 'https://xacjvyjiyvouqpuxwnwf.supabase.co';
        const KEY = 'sb_publishable_c0L4_aJuEqJWMkcPGGACsw_VNR8C7zx'; 
        
        // 初始化
        const supabase = window.supabase.createClient(URL, KEY);

        async function testRegister() {
            document.getElementById('result').innerText = '请求发送中...';
            console.log("发起注册请求...");

            // 直接用纯英文和合法后缀，排除一切干扰
            const { data, error } = await supabase.auth.signUp({
                email: 'test001@qq.com', 
                password: 'password123'
            });

            if (error) {
                console.error("报错了：", error);
                document.getElementById('result').innerText = '失败：' + error.message;
                document.getElementById('result').style.color = 'red';
            } else {
                console.log("成功：", data);
                document.getElementById('result').innerText = '注册成功！请去后台查看！';
                document.getElementById('result').style.color = 'green';
            }
        }
    </script>
</body>
</html>
